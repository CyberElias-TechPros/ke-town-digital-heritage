<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/src/assets/techpros.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#c8882a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KE Town" />
    <title>KE Town Digital Heritage</title>
    <meta name="description" content="KE Town Digital Heritage Project by Cyber Elias Academy - Preserving Kalabari culture and connecting the community worldwide" />
    <meta name="author" content="Cyber Elias Academy" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ketown.cyberelias.com/" />
    <meta property="og:title" content="KE Town Digital Heritage" />
    <meta property="og:description" content="Preserving Kalabari culture and connecting the KE Town community worldwide" />
    <meta property="og:image" content="/src/assets/techpros.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@cybeliasacademy" />
    <meta name="twitter:title" content="KE Town Digital Heritage" />
    <meta name="twitter:description" content="Preserving Kalabari culture and connecting the KE Town community worldwide" />
    <meta name="twitter:image" content="/src/assets/techpros.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "KE Town Digital Heritage",
      "description": "Preserving Kalabari culture and connecting the KE Town community worldwide",
      "url": "https://ketown.cyberelias.com/",
      "author": {
        "@type": "Organization",
        "name": "Cyber Elias Academy"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://ketown.cyberelias.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
