name: tmp-mig-slams
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Clone target repo
        run: git clone --depth 1 https://x-access-token:${{ secrets.MIGRATION_PAT }}@github.com/CyberElias-TechPros/smart-attendance-hub.git target
      - name: Install deps
        working-directory: target
        run: npm ci --no-fund --no-audit
      - name: Show applied migrations
        working-directory: target
        run: npx -y wrangler@latest d1 migrations list slams --remote
      - name: Apply outstanding migrations
        working-directory: target
        run: npx -y wrangler@latest d1 migrations apply slams --remote
      - name: Ensure SLAMS_JWT_SECRET (only if absent)
        run: |
          HAVE=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/slams-api/secrets" | grep -c SLAMS_JWT_SECRET || true)
          echo "present=$HAVE"
          if [ "$HAVE" = "0" ]; then
            curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/slams-api/secrets" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "$(jq -n --arg t "${{ secrets.TMP_SLAMS_JWT }}" '{name:"SLAMS_JWT_SECRET",text:$t,type:"secret_text"}')"
          fi
      - name: Deploy worker
        working-directory: target
        run: npx -y wrangler@latest deploy
      - name: Verify health
        run: |
          body="$(curl -fsS https://slams-api.cyber-e54.workers.dev/api/health)"
          echo "$body"; echo "$body" | grep -q '"status":"ok"'
