name: tmp-cleanup-qa
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Delete QA test user
        run: |
          U="usr_0mv035wxy1a4p000g163k1p46"
          npx -y wrangler@latest d1 execute ke-town-db --remote --command "DELETE FROM sessions WHERE user_id='$U';"
          npx -y wrangler@latest d1 execute ke-town-db --remote --command "DELETE FROM audit_logs WHERE user_id='$U';"
          npx -y wrangler@latest d1 execute ke-town-db --remote --command "DELETE FROM users WHERE id='$U';"
          npx -y wrangler@latest d1 execute ke-town-db --remote --command "SELECT count(*) AS remaining FROM users WHERE id='$U';"
