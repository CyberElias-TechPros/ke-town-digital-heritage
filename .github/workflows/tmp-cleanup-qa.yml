name: tmp-cleanup-qa
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Delete QA test user from affiliate-hub-db-v2
        run: |
          U="9b7559d5-04fd-4ce6-92d6-ed31f313c2a0"
          npx -y wrangler@latest d1 execute affiliate-hub-db-v2 --remote --command "DELETE FROM wallet_reconciliations WHERE user_id='$U';"
          npx -y wrangler@latest d1 execute affiliate-hub-db-v2 --remote --command "DELETE FROM wallets WHERE user_id='$U';"
          npx -y wrangler@latest d1 execute affiliate-hub-db-v2 --remote --command "DELETE FROM refresh_tokens WHERE user_id='$U';"
          npx -y wrangler@latest d1 execute affiliate-hub-db-v2 --remote --command "DELETE FROM bank_details WHERE user_id='$U';"
          npx -y wrangler@latest d1 execute affiliate-hub-db-v2 --remote --command "DELETE FROM users WHERE id='$U';"
          npx -y wrangler@latest d1 execute affiliate-hub-db-v2 --remote --command "SELECT count(*) AS remaining FROM users WHERE id='$U';"
