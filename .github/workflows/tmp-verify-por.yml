name: tmp-verify-por
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: List portify-db tables (read-only)
        run: npx -y wrangler@latest d1 execute portify-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
