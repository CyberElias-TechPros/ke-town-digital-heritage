name: tmp-check-slams
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Tables + department count (read-only)
        run: |
          npx -y wrangler@latest d1 execute slams --remote --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
          npx -y wrangler@latest d1 execute slams --remote --command "SELECT count(*) AS departments FROM departments;"
          npx -y wrangler@latest d1 execute slams --remote --command "SELECT count(*) AS users FROM users;"
