name: tmp-probe-register
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Check for orphan test user (read-only)
        run: |
          npx -y wrangler@latest d1 execute ke-town-db --remote --command "SELECT id, email, created_at FROM users WHERE email LIKE 'qafixketown%';"
