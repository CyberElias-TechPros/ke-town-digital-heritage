name: tmp-check-aff1
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Dump live schema + journal (read-only)
        run: |
          npx -y wrangler@latest d1 execute affiliate-hub-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
          npx -y wrangler@latest d1 execute affiliate-hub-db --remote --command "SELECT sql FROM sqlite_master WHERE type='table' AND name NOT LIKE 'd1_%' AND name NOT LIKE '_cf_%' AND name NOT LIKE 'sqlite_%';"
          npx -y wrangler@latest d1 execute affiliate-hub-db --remote --command "SELECT * FROM d1_migrations ORDER BY id;"
          npx -y wrangler@latest d1 execute affiliate-hub-db --remote --command "SELECT email, role, provider, created_at FROM users ORDER BY created_at;"
