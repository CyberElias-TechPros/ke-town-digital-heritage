name: tmp-cleanup-lsc
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Delete QA test user from slams
        run: |
          U="42af8f3e-6bfd-4249-9b8f-afb3a0c68825"
          npx -y wrangler@latest d1 execute slams --remote --command "DELETE FROM email_tokens WHERE user_id='$U';"
          npx -y wrangler@latest d1 execute slams --remote --command "DELETE FROM sessions WHERE user_id='$U';"
          npx -y wrangler@latest d1 execute slams --remote --command "DELETE FROM consents WHERE user_id='$U';"
          npx -y wrangler@latest d1 execute slams --remote --command "DELETE FROM users WHERE id='$U';"
          npx -y wrangler@latest d1 execute slams --remote --command "SELECT count(*) AS remaining FROM users WHERE id='$U';"
