name: tmp-reconcile
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard reconcile file present
        working-directory: worker
        run: |
          test -f reconcile-prod.sql
          wc -l reconcile-prod.sql
          grep -c "ALTER TABLE\|CREATE TABLE" reconcile-prod.sql
      - name: Apply one-shot reconcile to ke-town-db
        working-directory: worker
        run: npx -y wrangler@latest d1 execute ke-town-db --remote --file=reconcile-prod.sql
