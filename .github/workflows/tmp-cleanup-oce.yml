name: tmp-cleanup-oce
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.TMP_UNI_TOKEN }}
    steps:
      - name: Delete QA test user from ocean-stride-db
        run: |
          export CLOUDFLARE_ACCOUNT_ID=ba3a0c06ca86c6e61d2c6b0350abb80b
          npx -y wrangler@latest d1 execute ocean-stride-db --remote --command "DELETE FROM users WHERE id='c10e4430ef25a13c8506b1ac';"
          npx -y wrangler@latest d1 execute ocean-stride-db --remote --command "SELECT count(*) AS remaining FROM users WHERE id='c10e4430ef25a13c8506b1ac';"
