name: tmp-cleanup-cgf
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Delete QA test user from cloudgather
        run: |
          U="f35ae080-6348-4050-b30c-5efc26035201"
          npx -y wrangler@latest d1 execute cloudgather --remote --command "DELETE FROM sessions WHERE user_id='$U';"
          npx -y wrangler@latest d1 execute cloudgather --remote --command "DELETE FROM users WHERE id='$U';"
          npx -y wrangler@latest d1 execute cloudgather --remote --command "SELECT count(*) AS remaining FROM users WHERE id='$U';"
