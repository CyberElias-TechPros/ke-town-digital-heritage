name: tmp-cosmic-infra
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Ensure KV namespace
        run: |
          KVID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" | jq -r '.result[] | select(.title | contains("cosmic")) | .id' | head -1)
          if [ -z "$KVID" ]; then
            npx -y wrangler@latest kv namespace create cosmic-cache
            KVID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" | jq -r '.result[] | select(.title | contains("cosmic")) | .id' | head -1)
          fi
          echo "KVID=$KVID"; test -n "$KVID"
      - name: Ensure R2 buckets
        run: |
          npx -y wrangler@latest r2 bucket list | grep -q cosmic-invader-replays || npx -y wrangler@latest r2 bucket create cosmic-invader-replays
      - name: Ensure queues
        run: |
          npx -y wrangler@latest queues list | grep -q cosmic-run-processing || npx -y wrangler@latest queues create cosmic-run-processing
          npx -y wrangler@latest queues list | grep -q cosmic-run-processing-dlq || npx -y wrangler@latest queues create cosmic-run-processing-dlq
          npx -y wrangler@latest queues list | grep -q cosmic-events || npx -y wrangler@latest queues create cosmic-events
      - name: Ensure SESSION_SECRET (only if absent)
        run: |
          HAVE=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/cosmic-invader-frontiers-api/secrets" | grep -c SESSION_SECRET || true)
          echo "present=$HAVE"
          if [ "$HAVE" = "0" ]; then
            curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/cosmic-invader-frontiers-api/secrets" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "$(jq -n --arg t "${{ secrets.TMP_COSMIC_SESS }}" '{name:"SESSION_SECRET",text:$t,type:"secret_text"}')"
          fi
