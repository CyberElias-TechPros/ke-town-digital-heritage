name: tmp-tail-register
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Tail worker while triggering register (debug)
        run: |
          npx -y wrangler@latest tail ke-town-api --format pretty > /tmp/tail.log 2>&1 &
          TAILPID=$!
          sleep 10
          curl -s -X POST https://ke-town-api.cyber-e54.workers.dev/auth/register -H "Content-Type: application/json" --data '{"fullName":"Tail Probe","email":"tailprobe@example.com","password":"Testpass123!"}' | head -c 300
          echo
          sleep 20
          kill $TAILPID || true
          sleep 2
          grep -v "^\s*$" /tmp/tail.log | tail -40
