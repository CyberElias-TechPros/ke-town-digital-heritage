name: tmp-dump-schema
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Check news + users columns (read-only)
        run: |
          npx -y wrangler@latest d1 execute ke-town-db --remote --command "SELECT name FROM pragma_table_info('news') ORDER BY cid;"
          npx -y wrangler@latest d1 execute ke-town-db --remote --command "SELECT name FROM pragma_table_info('users') ORDER BY cid;"
          npx -y wrangler@latest d1 execute ke-town-db --remote --command "SELECT id, title, status FROM news LIMIT 3;"
          npx -y wrangler@latest d1 execute ke-town-db --remote --command "SELECT sql FROM sqlite_master WHERE type='table' AND name NOT LIKE 'd1_%' AND name NOT LIKE '_cf_%' AND name NOT LIKE 'sqlite_%';"
