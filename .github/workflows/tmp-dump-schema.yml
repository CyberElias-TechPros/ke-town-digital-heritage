name: tmp-dump-schema
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Dump tables + journal (read-only)
        run: |
          npx -y wrangler@latest d1 execute ke-town-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
          npx -y wrangler@latest d1 execute ke-town-db --remote --command "SELECT * FROM d1_migrations ORDER BY id;"
          npx -y wrangler@latest d1 execute ke-town-db --remote --command "SELECT (SELECT count(*) FROM users) AS users, (SELECT count(*) FROM posts) AS posts, (SELECT count(*) FROM products) AS products, (SELECT count(*) FROM news) AS news, (SELECT count(*) FROM events) AS events, (SELECT count(*) FROM donations) AS donations, (SELECT count(*) FROM polls) AS polls;"
