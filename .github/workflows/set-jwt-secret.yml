name: Set JWT secret on ke-town-api

on:
  workflow_dispatch:

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Set JWT_SECRET worker secret (direct API)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          resp="$(curl -sS -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"JWT_SECRET\",\"text\":\"$JWT_SECRET\",\"type\":\"secret_text\"}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/ke-town-api/secrets")"
          echo "$resp"
          echo "$resp" | grep -q '"success": true' || { echo "::error::failed to set JWT_SECRET"; exit 1; }
      - name: Verify secret is registered
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          before="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/ke-town-api/secrets")"
          echo "$before"
          echo "$before" | grep -q "JWT_SECRET" || { echo "::error::secret not found on worker"; exit 1; }