name: tmp-secret-inventory
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: List workers + secret names on all accounts (read-only)
        run: |
          for acct in c567f93a5269d713595b68c75f8f33c5 289175720a30033010f7d376dbb99792 b7399f904cf2b63772526dd43507f630 e543b6a0521fc8fd76447ceba097b665 63a08cfca1bff559bf682dcf2a3eafed ccb3266ecc6459c52ea1236c173107e2 ba3a0c06ca86c6e61d2c6b0350abb80b 5811dd42c9cd0cbd486232e27d22dfc1; do
            echo "=== account $acct ==="
            for w in $(curl -s -H "Authorization: Bearer ${{ secrets.TMP_UNI_TOKEN }}" "https://api.cloudflare.com/client/v4/accounts/$acct/workers/scripts?per_page=100" | jq -r '.result[].id'); do
              names=$(curl -s -H "Authorization: Bearer ${{ secrets.TMP_UNI_TOKEN }}" "https://api.cloudflare.com/client/v4/accounts/$acct/workers/scripts/$w/secrets" | jq -r '.result[].name' | paste -sd,)
              echo "$w :: secrets=[$names]"
            done
          done
