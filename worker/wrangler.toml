name = "ke-town-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------
# The Worker serves BOTH the built SPA (dist) and the JSON API
# under /api. One deployment = one origin = zero CORS problems.
# ---------------------------------------------------------------
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# ---------------------------------------------------------------
# Primary relational store — SQLite at the edge
# ---------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "KE_DB"
database_id = "REPLACE_WITH_REAL_D1_ID"
migrations_dir = "migrations"

# ---------------------------------------------------------------
# Uploads (images / audio / video / documents)
# ---------------------------------------------------------------
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "ke-town-media"

# ---------------------------------------------------------------
# Sessions, rate limiting, realtime presence, cached counters
# ---------------------------------------------------------------
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_REAL_KV_ID"

# ---------------------------------------------------------------
# Cross-isolate realtime fan-out for chat + notifications
# ---------------------------------------------------------------
[[durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeHub"

[[migrations]]
tag = "v1"
new_classes = ["RealtimeHub"]

# ---------------------------------------------------------------
# Cron: nightly engagement digests + cleanup
# ---------------------------------------------------------------
[triggers]
crons = ["17 3 * * *"]

[vars]
APP_NAME = "KE Town Digital Heritage"
APP_URL = "https://ke-town.example.com"
JWT_TTL_SECONDS = "604800"
UPLOAD_MAX_BYTES = "10485760"
DEFAULT_CURRENCY = "NGN"
ADMIN_EMAIL = "admin@ketown.com.ng"
# Set to "1" to return the password-reset token in the API response
# (handy in development, must stay "0" in production).
EXPOSE_RESET_TOKEN = "0"

# [placement]
# mode = "smart"
